<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to HunarHub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #E67E5B;
            --text-color: #5A4A3A;
            --light-bg: #FAF7F2;
        }

        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, #F0A085 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .onboard-card {
            background: var(--light-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.18);
        }

        .brand {
            color: var(--primary-color);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            padding: 12px 15px;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(230, 126, 91, 0.1);
        }

        .btn-primary {
            background: var(--primary-color);
            border: none;
            border-radius: 25px;
            padding: 12px 20px;
            font-weight: 600;
            width: 100%;
        }

        .btn-primary:hover {
            background: #d16b47;
        }
    </style>
</head>
<body>
    <main class="onboard-card">
        <div class="brand">
            HunarHub <i class="fas fa-palette"></i>
        </div>
        <p class="mb-4">Tell us a little about your craft so your assistant can personalize suggestions.</p>

        <form action="{{ url_for('create_artisan') }}" method="post">
            <input type="hidden" name="next" value="{{ next_url }}">

            <div class="mb-3">
                <label class="form-label" for="name">Name *</label>
                <input class="form-control" id="name" name="name" required maxlength="100" placeholder="Your name">
            </div>

            <div class="mb-3">
                <label class="form-label" for="craft_type">Craft type</label>
                <input class="form-control" id="craft_type" name="craft_type" maxlength="100" placeholder="Pottery, textiles, woodwork...">
            </div>

            <div class="mb-3">
                <label class="form-label" for="location">Location</label>
                <input class="form-control" id="location" name="location" maxlength="100" placeholder="City or region">
            </div>

            <div class="mb-4">
                <label class="form-label" for="language_pref">Language</label>
                <select class="form-control" id="language_pref" name="language_pref">
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                    <option value="bn">Bengali</option>
                    <option value="ta">Tamil</option>
                    <option value="te">Telugu</option>
                    <option value="mr">Marathi</option>
                </select>
            </div>

            <button class="btn btn-primary" type="submit">
                <i class="fas fa-arrow-right me-2"></i>
                Continue
            </button>
        </form>
    </main>
</body>
</html>
